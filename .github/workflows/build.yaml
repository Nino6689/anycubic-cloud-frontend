name: Build

# This package ships prebuilt JavaScript, so there is nothing to unit-test --
# but the packaging itself can still break, and it breaks in a way nobody
# notices until Home Assistant fails to serve a panel. The two things worth
# guarding are that the wheel actually builds, and that the bundles named in
# constants.py are the ones inside it: those hashes are stamped by
# tools/sync_bundles.py, and a hand edit that disagrees with the filenames
#404s the panel or leaves every browser on the previous card.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: The bundles must match what constants.py claims
        run: |
          python - <<'PY'
          import glob, pathlib, re, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          constants = pathlib.Path("src/anycubic_cloud_frontend/constants.py").read_text()
          file_hash = re.search(r'FILE_HASH[^"]*"([^"]+)"', constants).group(1)
          card_hash = re.search(r'CARD_HASH[^"]*"([^"]+)"', constants).group(1)

          entrypoint = f"entrypoint.{file_hash}.js"
          problems = []

          if not any(n.endswith(entrypoint) for n in names):
              problems.append(
                  f"constants.py names {entrypoint}, which is not in the wheel"
              )
          if not any(n.endswith("anycubic-card.js") for n in names):
              problems.append("anycubic-card.js is missing from the wheel")

          # The card hash is a query string, not a filename, so it cannot be
          # checked against the archive -- only that it was stamped at all.
          if len(card_hash) != 8:
              problems.append(f"CARD_HASH {card_hash!r} is not an 8-character digest")

          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
